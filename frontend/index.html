<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>外文电子图书库文山学院</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <div class="page">
    <div class="header"></div>

    <div class="search-area">
      <div class="search-con">
        <input id="q" class="textbox" type="text" placeholder="请输入检索词" />
        <button id="searchBtn" class="search-btn" type="button" onclick="doSearch(1)">搜索</button>
      </div>
    </div>

    <div id="homeBox" class="home-box">
      <div class="home-title">浏览数据</div>
      <ul id="homeList" class="home-list"></ul>
      <div id="homeEmpty" class="home-empty" style="display:none;">暂无可浏览资源</div>
    </div>

    <div id="searchWrap" class="search-wrap">
      <div class="panel">
        <div id="facetHeader" class="panel-title">中图分类法(2022)</div>
        <div id="facetTree" class="cnl-tree-wrap"></div>
      </div>

      <div class="panel">
        <div id="summary" class="summary"></div>
        <div id="results"></div>
      </div>

      <div class="panel right-panel">
        <div class="panel-title">聚合结果</div>
        <div class="right-panel-body">
          <div id="rightPager" class="right-pager"></div>
          <div id="rightAgg" class="right-box"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>

</html>
