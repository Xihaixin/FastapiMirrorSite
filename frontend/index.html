<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>学术资源检索 Demo</title>
  <style>
    html, body { overflow-x: hidden; }
    body { font-family: "PingFang SC","Microsoft YaHei",Arial,sans-serif; margin: 0; background: #f2f2f2; color: #222; font-size: 13px; line-height: 1.42857143; }
    a, a:hover { text-decoration: none; color: #666; }

    /* 页面宽度：仿原站居中布局（先不做左右栏，但保留整体宽度感） */
    .page { width: 1000px; max-width: calc(100vw - 24px); margin: 0 auto; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

    /* 顶部横幅：置于页面容器内，而非全宽铺满 */
    .header{
      background: url(/static/top-new.jpg) no-repeat center center;
      height: 212px;
      background-size: cover;
      border-bottom: 1px solid #dcdcdc;
    }

    /* 搜索条：位于横幅下方、居中 */
    .search-area { padding: 10px 0 12px; background: #fff; }
    .search_con { width: 580px; max-width: calc(100% - 24px); margin: 0 auto; }
    .search_h30 { background:#fff; color:#666; width:100%; height: 45px; line-height: 45px; position: relative; border: 1px solid #dcdcdc; }
    .textbox_con { width: calc(100% - 70px); float:left; position: relative; }
    .textbox { width:100%; border:none; font-size:16px; padding:0 10px; outline:none; height:45px; line-height:45px; box-sizing: border-box; }
    .search_btn { position: absolute; right: 0; top:0; width:70px; height:45px; }
    .search_btn button {
      width: 70px;
      height: 45px;
      border: none;
      background: #152a8c;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .search_btn button:hover { background-color:#1f39ae; }

    /* 中间主栏：仿原站“中间栏宽度” */
    .content-wrap { width: 720px; max-width: calc(100% - 24px); margin: 0 auto 24px; }
    .content-box { border: 1px solid #dcdcdc; background: #fff; }
    .summary {
      padding: 8px 10px;
      color: #444;
      font-size: 12px;
      border-bottom: 1px solid #e5e5e5;
      background: #fafafa;
    }

    .resource { border-bottom: 1px solid #eaeaea; padding: 12px 10px; }
    .resource:hover { background: #f6fbff; }
    .resource-row { display: flex; gap: 14px; }
    .cover-img {
      width: 92px;
      height: 124px;
      object-fit: cover;
      border: 1px solid #d6d6d6;
      background: #fafafa;
      flex: 0 0 auto;
    }
    .resource:hover .cover-img { box-shadow: 0 3px 10px rgba(0,0,0,0.22); transition: box-shadow .2s ease-in-out; }
    .content { flex: 1 1 auto; min-width: 0; }
    .title-line { font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
    .index-no { color: #777; margin-right: 4px; }
    .title-link { color: #1f5ea6; font-weight: 700; }
    .title-link:hover { text-decoration: underline; }
    .meta { color: #333; font-size: 12px; line-height: 1.7; }
    .label { color: #666; display: inline-block; min-width: 62px; }
    .linklike { color: #1f5ea6; text-decoration: underline; cursor: pointer; }
    .hl { color: #d40000; font-weight: 700; }

    @media (max-width: 767px) {
      .header{ height: 170px; }
      .content-wrap { width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header"></div>

    <div class="search-area">
      <div class="search_con">
        <div class="search_h30">
          <div class="textbox_con">
            <input id="q" class="textbox" type="text" placeholder="请输入检索词" />
          </div>
          <div class="search_btn">
            <button id="searchBtn" type="button" onclick="doSearch()">搜索</button>
          </div>
        </div>
      </div>
    </div>

    <div class="content-wrap">
      <div class="content-box">
        <div id="summary" class="summary"></div>
        <div id="results"></div>
      </div>
    </div>
  </div>

  <script>
    function getApiUrl(path) {
      return new URL(path, window.location.origin).toString();
    }

    function splitMultiValue(s) {
      if (!s) return [];
      return String(s)
        .split(/[;；,，、]\s*/g)
        .map((x) => x.trim())
        .filter(Boolean);
    }

    function gotoSearch(term) {
      window.location.href = `/static/index.html?q=${encodeURIComponent(term)}`;
    }

    function renderClickableValues(container, values, onClick) {
      const parts = splitMultiValue(values);
      if (!parts.length) {
        container.textContent = "未知";
        return;
      }
      parts.forEach((part, idx) => {
        const a = document.createElement("a");
        a.href = `/static/index.html?q=${encodeURIComponent(part)}`;
        a.className = "linklike";
        a.textContent = part;
        a.onclick = (e) => {
          e.preventDefault();
          onClick(part);
        };
        container.appendChild(a);
        if (idx !== parts.length - 1) {
          container.appendChild(document.createTextNode("；"));
        }
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, term) {
      if (!text) return "";
      if (!term) return escapeHtml(text);
      const t = String(term).trim();
      if (!t) return escapeHtml(text);
      const safeText = escapeHtml(String(text));
      const re = new RegExp(escapeRegExp(t), "gi");
      return safeText.replace(re, (m) => `<span class="hl">${m}</span>`);
    }

    async function doSearch() {
      const q = document.getElementById("q").value.trim();
      const url = new URL(getApiUrl("/resources/search"));
      if (q) {
        url.searchParams.set("q", q);
      }
      url.searchParams.set("page", "1");
      url.searchParams.set("size", "20");

      const t0 = performance.now();
      const res = await fetch(url);
      const data = await res.json();
      const t1 = performance.now();

      const summary = document.getElementById("summary");
      const elapsedMs = t1 - t0;
      const timeText = elapsedMs < 10 ? "小于0.01秒" : `${(elapsedMs / 1000).toFixed(2)}秒`;
      summary.textContent = `在“外文电子图书库文山学院”中，当前命中：${data.length} 条信息，搜索耗时：${timeText}`;

      const container = document.getElementById("results");
      container.innerHTML = "";

      if (!data.length) {
        container.textContent = "没有检索到记录。";
        return;
      }

      data.forEach((item) => {
        const div = document.createElement("div");
        div.className = "resource";

        const row = document.createElement("div");
        row.className = "resource-row";

        const cover = document.createElement("img");
        cover.className = "cover-img";
        cover.alt = "封面";
        // 参考站点资源：这里先用一张示例封面占位（后续可接入真实封面字段）
        cover.src = "/mirror/index/2.jpg";
        cover.onerror = () => {
          cover.removeAttribute("src");
          cover.style.background = "#fafafa";
        };

        const content = document.createElement("div");
        content.className = "content";

        // 题名（可点击进入详情）
        const titleLine = document.createElement("div");
        titleLine.className = "title-line";
        const idxSpan = document.createElement("span");
        idxSpan.className = "index-no";
        idxSpan.textContent = `${String(container.childElementCount + 1)}.`;
        titleLine.appendChild(idxSpan);

        const titleLink = document.createElement("a");
        const detailUrl = q
          ? `/static/detail.html?id=${encodeURIComponent(item.id)}&q=${encodeURIComponent(q)}`
          : `/static/detail.html?id=${encodeURIComponent(item.id)}`;
        titleLink.href = detailUrl;
        titleLink.className = "title-link";
        titleLink.innerHTML = highlight(item.title || "(无题名)", q);
        titleLink.onclick = (e) => {
          e.preventDefault();
          window.location.href = detailUrl;
        };
        titleLine.appendChild(titleLink);

        const meta = document.createElement("div");
        meta.className = "meta";

        const authorsRow = document.createElement("div");
        const authorsLabel = document.createElement("span");
        authorsLabel.className = "label";
        authorsLabel.textContent = "责任者：";
        const authorsVals = document.createElement("span");
        renderClickableValues(authorsVals, item.authors, gotoSearch);
        authorsRow.appendChild(authorsLabel);
        authorsRow.appendChild(authorsVals);

        const keywordsRow = document.createElement("div");
        const keywordsLabel = document.createElement("span");
        keywordsLabel.className = "label";
        keywordsLabel.textContent = "主题词：";
        const keywordsVals = document.createElement("span");
        renderClickableValues(keywordsVals, item.keywords, gotoSearch);
        keywordsRow.appendChild(keywordsLabel);
        keywordsRow.appendChild(keywordsVals);

        const publishRow = document.createElement("div");
        const publishLabel = document.createElement("span");
        publishLabel.className = "label";
        publishLabel.textContent = "出版日期：";
        const publishDisplay = item.publish_date || item.publish_year || "";
        const publishVal = document.createElement("span");
        publishVal.textContent = publishDisplay || "未知";
        publishRow.appendChild(publishLabel);
        publishRow.appendChild(publishVal);

        meta.appendChild(authorsRow);
        meta.appendChild(keywordsRow);
        meta.appendChild(publishRow);

        content.appendChild(titleLine);
        content.appendChild(meta);

        row.appendChild(cover);
        row.appendChild(content);
        div.appendChild(row);

        container.appendChild(div);
      });
    }

    function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const q = (params.get("q") || "").trim();
      if (q) {
        document.getElementById("q").value = q;
        doSearch();
      } else {
        document.getElementById("summary").textContent = "";
      }
    }

    document.getElementById("q").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch();
    });

    initFromQuery();
  </script>
</body>
</html>
