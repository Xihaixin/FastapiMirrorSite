<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>外文电子图书库文山学院</title>
  <style>
    html, body { overflow-x: hidden; }
    body { margin: 0; background: #ececec; color: #222; font: 13px/1.42 "Microsoft YaHei", Arial, sans-serif; }
    a { color: #1f5ea6; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .page { width: 1000px; max-width: calc(100vw - 24px); margin: 0 auto; background: #fff; }
    .header { height: 212px; border-bottom: 1px solid #dcdcdc; background: url(/static/top-new.jpg) no-repeat center/cover; }

    .search-area { padding: 10px 0 12px; background: #fff; }
    .search-con { width: 580px; max-width: calc(100% - 24px); margin: 0 auto; position: relative; height: 45px; border: 1px solid #dcdcdc; }
    .textbox { width: calc(100% - 70px); border: 0; outline: none; font-size: 16px; height: 45px; line-height: 45px; padding: 0 10px; box-sizing: border-box; }
    .search-btn { position: absolute; right: 0; top: 0; width: 70px; height: 45px; border: 0; background: #1f5ea6; color: #fff; cursor: pointer; font-size: 14px; }
    .search-btn:hover { background: #2a6ec2; }

    .home-box { width: calc(100% - 24px); margin: 0 auto 24px; border: 1px solid #8ed0ea; background: #fff; }
    .home-title { padding: 6px 10px; border-bottom: 1px solid #cdebf8; background: #f4fbff; color: #1a4d74; font-weight: 700; }
    .home-list { margin: 0; padding: 8px 16px 12px 20px; columns: 4; column-gap: 20px; }
    .home-list li { break-inside: avoid; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .home-empty { padding: 10px; color: #666; }

    .search-wrap { width: calc(100% - 24px); margin: 0 auto 24px; display: none; grid-template-columns: 240px 1fr 230px; gap: 10px; }
    .panel { border: 1px solid #dcdcdc; background: #fff; }
    .panel-title { padding: 6px 10px; border-bottom: 1px solid #e4e4e4; background: linear-gradient(to bottom, #f5f9fe 0%, #e7f1fb 100%); color: #2d4d74; font-weight: 700; }
    .facet-tools { padding: 6px 10px; border-bottom: 1px solid #efefef; font-size: 12px; color: #666; }
    .facet-tools a { margin-right: 10px; }
    .facet-body { max-height: 760px; overflow: auto; padding: 8px 10px 10px; }

    .facet-list, .facet-list ul { list-style: none; margin: 0; padding: 0; }
    .facet-list ul { padding-left: 18px; }
    .facet-item { margin: 3px 0; white-space: nowrap; }
    .facet-hit { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: #333; padding: 1px 2px; border-radius: 2px; }
    .facet-hit:hover { background: #f0f7ff; }
    .facet-toggle { width: 12px; text-align: center; color: #777; font-size: 11px; }
    .facet-dot { width: 6px; height: 6px; border-radius: 50%; background: #999; display: inline-block; }
    .facet-name { color: #222; }
    .facet-count { color: #1f5ea6; }
    .facet-item.active > .facet-hit { background: #e8f2ff; color: #0f4b92; font-weight: 700; }
    .facet-children { display: block; }
    .facet-children.collapsed { display: none; }

    .summary { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid #e5e5e5; background: #fafafa; color: #333; }
    .filter-tip { margin-left: 8px; color: #0f4b92; }
    .resource { border-bottom: 1px solid #eaeaea; padding: 12px 10px; }
    .resource:hover { background: #f7fbff; }
    .resource-row { display: flex; gap: 14px; }
    .cover-img { width: 92px; height: 124px; object-fit: cover; border: 1px solid #d6d6d6; background: #fafafa; flex: 0 0 auto; }
    .content { flex: 1 1 auto; min-width: 0; }
    .title-line { font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
    .index-no { color: #777; margin-right: 4px; }
    .title-link { color: #1f5ea6; font-weight: 700; }
    .meta { color: #333; font-size: 12px; line-height: 1.7; }
    .label { color: #666; display: inline-block; min-width: 62px; }
    .linklike { color: #1f5ea6; text-decoration: underline; cursor: pointer; }
    .hl { color: #d40000; font-weight: 700; }

    .right-box { padding: 8px 10px; max-height: 760px; overflow: auto; }
    .agg-block { margin-bottom: 12px; }
    .agg-title { font-weight: 700; color: #223f66; margin-bottom: 6px; }
    .agg-list { list-style: none; margin: 0; padding: 0; }
    .agg-list li { margin: 3px 0; color: #333; }
    .agg-list .bullet { color: #666; margin-right: 4px; }
    .agg-link.active { color: #d40000; font-weight: 700; }

    @media (max-width: 1120px) {
      .home-list { columns: 2; }
      .search-wrap { grid-template-columns: 240px 1fr; }
      .right-panel { grid-column: 1 / span 2; }
    }
    @media (max-width: 900px) {
      .home-list { columns: 1; }
      .search-wrap { grid-template-columns: 1fr; }
      .right-panel { grid-column: auto; }
      .facet-body, .right-box { max-height: 280px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header"></div>

    <div class="search-area">
      <div class="search-con">
        <input id="q" class="textbox" type="text" placeholder="请输入检索词" />
        <button id="searchBtn" class="search-btn" type="button" onclick="doSearch(1)">搜索</button>
      </div>
    </div>

    <div id="homeBox" class="home-box">
      <div class="home-title">浏览数据</div>
      <ul id="homeList" class="home-list"></ul>
      <div id="homeEmpty" class="home-empty" style="display:none;">暂无可浏览资源</div>
    </div>

    <div id="searchWrap" class="search-wrap">
      <div class="panel">
        <div id="facetHeader" class="panel-title">中图分类法</div>
        <div class="facet-tools">
          <a href="javascript:void(0)" onclick="clearClassFilter()">清除分类筛选</a>
          <a href="javascript:void(0)" onclick="expandAll()">展开全部</a>
        </div>
        <div id="facetTree" class="facet-body"></div>
      </div>

      <div class="panel">
        <div id="summary" class="summary"></div>
        <div id="results"></div>
      </div>

      <div class="panel right-panel">
        <div class="panel-title">聚合结果</div>
        <div id="rightAgg" class="right-box"></div>
      </div>
    </div>
  </div>

  <script>
    let currentClassCode = "";
    let currentSearchPoint = "";
    let currentPublishYear = "";
    let currentLanguage = "";
    const facetExpandState = {};

    function getApiUrl(path) {
      return new URL(path, window.location.origin).toString();
    }

    function splitMultiValue(s) {
      if (!s) return [];
      return String(s).split(/[;；，、]\s*/g).map((x) => x.trim()).filter(Boolean);
    }

    function mapSearchPointLabelToKey(label) {
      if (label === "题名") return "title";
      if (label === "责任者") return "authors";
      if (label === "摘要") return "abstract";
      return "";
    }

    function gotoSearch(term) {
      const url = new URL("/static/index.html", window.location.origin);
      url.searchParams.set("q", term);
      window.location.href = url.toString();
    }

    function renderClickableValues(container, values, onClick) {
      const parts = splitMultiValue(values);
      if (!parts.length) { container.textContent = "未知"; return; }
      parts.forEach((part, idx) => {
        const a = document.createElement("a");
        a.href = `/static/index.html?q=${encodeURIComponent(part)}`;
        a.className = "linklike";
        a.textContent = part;
        a.onclick = (e) => { e.preventDefault(); onClick(part); };
        container.appendChild(a);
        if (idx !== parts.length - 1) container.appendChild(document.createTextNode("；"));
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function escapeRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, term) {
      if (!text) return "";
      if (!term) return escapeHtml(text);
      const t = String(term).trim();
      if (!t) return escapeHtml(text);
      const safeText = escapeHtml(String(text));
      const re = new RegExp(escapeRegExp(t), "gi");
      return safeText.replace(re, (m) => `<span class="hl">${m}</span>`);
    }

    function syncUrl(q) {
      const url = new URL(window.location.href);
      if (q) url.searchParams.set("q", q); else url.searchParams.delete("q");
      if (currentClassCode) url.searchParams.set("class_code", currentClassCode); else url.searchParams.delete("class_code");
      if (currentSearchPoint) url.searchParams.set("search_point", currentSearchPoint); else url.searchParams.delete("search_point");
      if (currentPublishYear) url.searchParams.set("publish_year", currentPublishYear); else url.searchParams.delete("publish_year");
      if (currentLanguage) url.searchParams.set("language", currentLanguage); else url.searchParams.delete("language");
      history.replaceState(null, "", url.toString());
    }

    function setModeSearch() {
      document.getElementById("homeBox").style.display = "none";
      document.getElementById("searchWrap").style.display = "grid";
    }

    function setModeHome() {
      document.getElementById("homeBox").style.display = "block";
      document.getElementById("searchWrap").style.display = "none";
    }

    async function loadHomeResources() {
      setModeHome();
      const res = await fetch(getApiUrl("/resources/home?size=20"));
      const items = await res.json();
      const homeList = document.getElementById("homeList");
      const homeEmpty = document.getElementById("homeEmpty");
      homeList.innerHTML = "";

      if (!Array.isArray(items) || !items.length) {
        homeEmpty.style.display = "block";
        return;
      }

      homeEmpty.style.display = "none";
      items.forEach((item) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        const detailUrl = new URL("/static/detail.html", window.location.origin);
        detailUrl.searchParams.set("id", item.id);
        a.href = detailUrl.toString();
        a.textContent = item.title || "(无标题)";
        li.appendChild(a);
        homeList.appendChild(li);
      });
    }

    function buildFacetTree(nodes) {
      const root = document.getElementById("facetTree");
      root.innerHTML = "";
      if (!nodes.length) { root.textContent = "暂无分类统计"; return; }
      const list = document.createElement("ul");
      list.className = "facet-list";
      nodes.forEach((node) => list.appendChild(buildFacetNode(node)));
      root.appendChild(list);
    }

    function buildFacetNode(node) {
      const li = document.createElement("li");
      li.className = "facet-item";
      if (node.code === currentClassCode) li.classList.add("active");

      const hit = document.createElement("div");
      hit.className = "facet-hit";
      hit.onclick = () => {
        currentClassCode = currentClassCode === node.code ? "" : node.code;
        doSearch(1);
      };

      const toggle = document.createElement("span");
      toggle.className = "facet-toggle";
      const hasChildren = !!(node.children && node.children.length);
      if (hasChildren) {
        const expanded = facetExpandState[node.code] !== false;
        toggle.textContent = expanded ? "▼" : "▶";
        toggle.onclick = (e) => {
          e.stopPropagation();
          facetExpandState[node.code] = !expanded;
          doSearch(1, true);
        };
      } else {
        const dot = document.createElement("span");
        dot.className = "facet-dot";
        toggle.appendChild(dot);
      }

      const name = document.createElement("span");
      name.className = "facet-name";
      name.textContent = node.name;
      const count = document.createElement("span");
      count.className = "facet-count";
      count.textContent = `(${node.count})`;

      hit.appendChild(toggle);
      hit.appendChild(name);
      hit.appendChild(count);
      li.appendChild(hit);

      if (hasChildren) {
        const ul = document.createElement("ul");
        const expanded = facetExpandState[node.code] !== false;
        ul.className = `facet-children${expanded ? "" : " collapsed"}`;
        node.children.forEach((child) => ul.appendChild(buildFacetNode(child)));
        li.appendChild(ul);
      }
      return li;
    }

    function renderAggBlock(title, buckets, type) {
      const block = document.createElement("div");
      block.className = "agg-block";
      const head = document.createElement("div");
      head.className = "agg-title";
      head.textContent = `${title}(${buckets.reduce((acc, i) => acc + (i.count || 0), 0)})`;
      block.appendChild(head);

      const ul = document.createElement("ul");
      ul.className = "agg-list";
      buckets.forEach((item) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "javascript:void(0)";
        a.className = "agg-link";
        const key = String(item.key);

        if (type === "search_points") {
          const mapped = mapSearchPointLabelToKey(key);
          if (mapped && mapped === currentSearchPoint) a.classList.add("active");
          a.onclick = () => {
            if (!mapped) return;
            currentSearchPoint = currentSearchPoint === mapped ? "" : mapped;
            doSearch(1);
          };
        } else if (type === "publish_years") {
          if (key === currentPublishYear) a.classList.add("active");
          a.onclick = () => {
            if (key === "未知") return;
            currentPublishYear = currentPublishYear === key ? "" : key;
            doSearch(1);
          };
        } else if (type === "languages") {
          if (key === currentLanguage) a.classList.add("active");
          a.onclick = () => {
            currentLanguage = currentLanguage === key ? "" : key;
            doSearch(1);
          };
        } else {
          a.onclick = () => {};
        }

        a.innerHTML = `<span class="bullet">●</span>${escapeHtml(key)}(${item.count})`;
        li.appendChild(a);
        ul.appendChild(li);
      });
      block.appendChild(ul);
      return block;
    }

    function buildRightAggregations(total, facets) {
      const container = document.getElementById("rightAgg");
      container.innerHTML = "";

      container.appendChild(renderAggBlock("查看站内搜索结果", [{ key: "命中记录", count: total }], "overview"));
      container.appendChild(renderAggBlock("检索点细分", facets.search_points || [], "search_points"));
      container.appendChild(renderAggBlock("按出版日期细分", facets.publish_years || [], "publish_years"));
      container.appendChild(renderAggBlock("按语种细分", facets.languages || [], "languages"));
    }

    function expandAll() {
      Object.keys(facetExpandState).forEach((k) => { facetExpandState[k] = true; });
      doSearch(1, true);
    }

    function clearClassFilter() {
      currentClassCode = "";
      doSearch(1);
    }

    async function doSearch(page = 1, keepTreeState = false) {
      const q = document.getElementById("q").value.trim();
      if (!q && !currentClassCode && !currentSearchPoint && !currentPublishYear && !currentLanguage) {
        syncUrl("");
        await loadHomeResources();
        return;
      }

      setModeSearch();
      const url = new URL(getApiUrl("/resources/search"));
      if (q) url.searchParams.set("q", q);
      if (currentClassCode) url.searchParams.set("class_code", currentClassCode);
      if (currentSearchPoint) url.searchParams.set("search_point", currentSearchPoint);
      if (currentPublishYear) url.searchParams.set("publish_year", currentPublishYear);
      if (currentLanguage) url.searchParams.set("language", currentLanguage);
      url.searchParams.set("page", String(page));
      url.searchParams.set("size", "20");

      const t0 = performance.now();
      const res = await fetch(url);
      const payload = await res.json();
      const items = payload.items || [];
      const total = typeof payload.total === "number" ? payload.total : items.length;
      const facets = payload.facets || {};
      const cnlFacets = facets.cnl || [];
      const t1 = performance.now();

      if (!keepTreeState) {
        cnlFacets.forEach((root) => {
          if (facetExpandState[root.code] == null) facetExpandState[root.code] = true;
        });
      }
      buildFacetTree(cnlFacets);
      buildRightAggregations(total, facets);

      const facetTotal = cnlFacets.reduce((acc, n) => acc + (n.count || 0), 0);
      document.getElementById("facetHeader").textContent = `中图分类法(${facetTotal})`;

      const elapsedMs = t1 - t0;
      const timeText = elapsedMs < 10 ? "小于0.01秒" : `${(elapsedMs / 1000).toFixed(2)}秒`;
      let filterText = "";
      if (currentClassCode) filterText += `<span class="filter-tip">分类：${escapeHtml(currentClassCode)}</span>`;
      if (currentSearchPoint) filterText += `<span class="filter-tip">检索点：${escapeHtml(currentSearchPoint)}</span>`;
      if (currentPublishYear) filterText += `<span class="filter-tip">年份：${escapeHtml(currentPublishYear)}</span>`;
      if (currentLanguage) filterText += `<span class="filter-tip">语种：${escapeHtml(currentLanguage)}</span>`;
      document.getElementById("summary").innerHTML = `在“外文电子图书库文山学院”中，命中：${total} 条，耗时：${timeText}` + filterText;

      syncUrl(q);

      const container = document.getElementById("results");
      container.innerHTML = "";
      if (!items.length) {
        container.textContent = "没有检索到记录。";
        return;
      }

      items.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "resource";

        const row = document.createElement("div");
        row.className = "resource-row";

        const cover = document.createElement("img");
        cover.className = "cover-img";
        cover.alt = "封面";
        cover.src = "/mirror/index/2.jpg";
        cover.onerror = () => { cover.removeAttribute("src"); cover.style.background = "#fafafa"; };

        const content = document.createElement("div");
        content.className = "content";

        const titleLine = document.createElement("div");
        titleLine.className = "title-line";
        const idxSpan = document.createElement("span");
        idxSpan.className = "index-no";
        idxSpan.textContent = `${idx + 1}.`;
        titleLine.appendChild(idxSpan);

        const titleLink = document.createElement("a");
        const detailUrl = new URL("/static/detail.html", window.location.origin);
        detailUrl.searchParams.set("id", item.id);
        if (q) detailUrl.searchParams.set("q", q);
        titleLink.href = detailUrl.toString();
        titleLink.className = "title-link";
        titleLink.innerHTML = highlight(item.title || "(无标题)", q);
        titleLine.appendChild(titleLink);

        const meta = document.createElement("div");
        meta.className = "meta";

        const authorsRow = document.createElement("div");
        const authorsLabel = document.createElement("span");
        authorsLabel.className = "label";
        authorsLabel.textContent = "责任者：";
        const authorsVals = document.createElement("span");
        renderClickableValues(authorsVals, item.authors, gotoSearch);
        authorsRow.appendChild(authorsLabel);
        authorsRow.appendChild(authorsVals);

        const keywordsRow = document.createElement("div");
        const keywordsLabel = document.createElement("span");
        keywordsLabel.className = "label";
        keywordsLabel.textContent = "主题词：";
        const keywordsVals = document.createElement("span");
        renderClickableValues(keywordsVals, item.keywords, gotoSearch);
        keywordsRow.appendChild(keywordsLabel);
        keywordsRow.appendChild(keywordsVals);

        const publishRow = document.createElement("div");
        const publishLabel = document.createElement("span");
        publishLabel.className = "label";
        publishLabel.textContent = "出版日期：";
        const publishVal = document.createElement("span");
        publishVal.textContent = item.publish_date || item.publish_year || "未知";
        publishRow.appendChild(publishLabel);
        publishRow.appendChild(publishVal);

        const cnlRow = document.createElement("div");
        const cnlLabel = document.createElement("span");
        cnlLabel.className = "label";
        cnlLabel.textContent = "中图分类：";
        const cnlVal = document.createElement("span");
        cnlVal.textContent = item.cnl_class_no || "未知";
        cnlRow.appendChild(cnlLabel);
        cnlRow.appendChild(cnlVal);

        meta.appendChild(authorsRow);
        meta.appendChild(keywordsRow);
        meta.appendChild(publishRow);
        meta.appendChild(cnlRow);

        content.appendChild(titleLine);
        content.appendChild(meta);
        row.appendChild(cover);
        row.appendChild(content);
        div.appendChild(row);
        container.appendChild(div);
      });
    }

    function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const q = (params.get("q") || "").trim();
      const classCode = (params.get("class_code") || "").trim();
      const searchPoint = (params.get("search_point") || "").trim();
      const publishYear = (params.get("publish_year") || "").trim();
      const language = (params.get("language") || "").trim();

      if (q) document.getElementById("q").value = q;
      if (classCode) currentClassCode = classCode;
      if (searchPoint) currentSearchPoint = searchPoint;
      if (publishYear) currentPublishYear = publishYear;
      if (language) currentLanguage = language;

      if (q || classCode || searchPoint || publishYear || language) doSearch(1);
      else loadHomeResources();
    }

    document.getElementById("q").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch(1);
    });

    initFromQuery();
  </script>
</body>
</html>
